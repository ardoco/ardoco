spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}

ardoco.neo4j.enabled=${NEO4J_ENABLED:true}

# This tells Spring Data Neo4j to automatically create indexes
# based on your entity annotations
spring.data.neo4j.database-selection.auto-create-indices=true

logging.level.org.springframework.data.neo4j=INFO
logging.level.org.springframework.data.neo4j.core=INFO
logging.level.org.springframework.data.neo4j.cypher=ERROR
