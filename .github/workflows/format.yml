name: Format

on:
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Determine Java version
        id: jve
        shell: bash
        run: |
          for expr in maven.compiler.target maven.compiler.release java.version; do
            v=$(mvn -B -q -N help:evaluate -DforceStdout -Dexpression="$expr" 2>/dev/null || true)
            v=${v#1.}
            if [[ "$v" =~ ^[0-9]+ ]]; then
              echo "java_major_version=${BASH_REMATCH[0]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Could not determine the Java version from the POM"
          exit 1
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ steps.jve.outputs.java_major_version }}
          cache: 'maven'
      - name: Format with Spotless in Maven
        run: mvn -B spotless:apply --file pom.xml
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply formatting changes
